; Valores por defecto del menu de opciones (UGameUserSettings).
; Es la capa base del proyecto: la primera vez que se arranca en una maquina
; nueva, estos son los valores que ve el jugador. Cuando el menu llama a
; "Save Settings", el resultado se escribe en
;   Editor:    Saved/Config/WindowsEditor/GameUserSettings.ini
;   Empaquetado: %LOCALAPPDATA%/ARQ_Interaction/Saved/Config/Windows/GameUserSettings.ini
; y esa capa tiene prioridad sobre esta.

[/Script/Engine.GameUserSettings]
bUseVSync=False
bUseDynamicResolution=False
FrameRateLimit=0.000000

; Niveles de escalabilidad: 0=Bajo 1=Medio 2=Alto 3=Epico 4=Cine
; sg.ResolutionQuality es un porcentaje (0-100), no un nivel.
[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3
